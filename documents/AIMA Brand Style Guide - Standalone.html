document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"background:#10142A;border:1px solid rgba(162,89,255,.2);border-radius:8px;overflow:hidden;\">\n          <div style=\"height:4px;background:#A259FF;\"><\u002Fdiv>\n          <div style=\"padding:18px 16px;\">\n            <div style=\"display:inline-block;background:rgba(162,89,255,.09);color:#C59FFF;font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:2px;margin-bottom:10px;\">Tier 04<\u002Fdiv>\n            <div style=\"font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;color:#fff;margin-bottom:6px;\">Sovereign<\u002Fdiv>\n            <div style=\"font-family:'Anton',sans-serif;font-size:18px;color:#fff;\"><sup style=\"color:#A259FF;font-size:11px;\">$<\u002Fsup>50,000<\u002Fdiv>\n            <div style=\"font-family:'Courier Prime',monospace;font-size:9px;color:#7A8BAA;margin-bottom:10px;letter-spacing:.06em;\">3-month engagement<\u002Fdiv>\n            <div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;margin-bottom:12px;\">Enterprise ops. Dedicated director, full AI automation pipeline.<\u002Fdiv>\n            <div style=\"padding:9px;text-align:center;background:#C8A84B;color:#060810;border-radius:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:700;\">Unlock Sovereign<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- Tier colour reference table -->\n      <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;overflow:hidden;\">\n        <div class=\"tbl-row\" style=\"grid-template-columns:80px 70px 1fr 1fr 1fr 1fr;\">\n          <div class=\"tbl-head\">Tier<\u002Fdiv><div class=\"tbl-head\">Colour<\u002Fdiv><div class=\"tbl-head\">Hex Value<\u002Fdiv><div class=\"tbl-head\">Top Bar<\u002Fdiv><div class=\"tbl-head\">Badge<\u002Fdiv><div class=\"tbl-head\">Button<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tbl-row\" style=\"grid-template-columns:80px 70px 1fr 1fr 1fr 1fr;\">\n          <div class=\"tbl-cell\">Spark<\u002Fdiv><div style=\"padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;color:#00D9F5;\">Cyan<\u002Fdiv><div class=\"tbl-cell-m\">#00D9F5<\u002Fdiv><div class=\"tbl-cell-m\">Solid cyan<\u002Fdiv><div class=\"tbl-cell-m\">rgba(cyan,.09)<\u002Fdiv><div class=\"tbl-cell-m\">Outline cyan<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tbl-row\" style=\"grid-template-columns:80px 70px 1fr 1fr 1fr 1fr;\">\n          <div class=\"tbl-cell\">Signal ✦<\u002Fdiv><div style=\"padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;color:#EDD483;\">Gold<\u002Fdiv><div class=\"tbl-cell-m\">#C8A84B / EDD483<\u002Fdiv><div class=\"tbl-cell-m\">Solid gold<\u002Fdiv><div class=\"tbl-cell-m\">rgba(gold,.09)<\u002Fdiv><div class=\"tbl-cell-m\">Fill gold<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tbl-row\" style=\"grid-template-columns:80px 70px 1fr 1fr 1fr 1fr;\">\n          <div class=\"tbl-cell\">Apex<\u002Fdiv><div style=\"padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;color:#FF5E20;\">Orange<\u002Fdiv><div class=\"tbl-cell-m\">#FF5E20<\u002Fdiv><div class=\"tbl-cell-m\">Solid orange<\u002Fdiv><div class=\"tbl-cell-m\">rgba(orange,.09)<\u002Fdiv><div class=\"tbl-cell-m\">Outline orange<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tbl-row\" style=\"grid-template-columns:80px 70px 1fr 1fr 1fr 1fr; border:none;\">\n          <div class=\"tbl-cell\" style=\"border-bottom:none;\">Sovereign<\u002Fdiv><div style=\"padding:9px 14px;font-size:13px;color:#A259FF;\">Purple<\u002Fdiv><div class=\"tbl-cell-m\" style=\"border-bottom:none;\">#A259FF<\u002Fdiv><div class=\"tbl-cell-m\" style=\"border-bottom:none;\">Solid purple<\u002Fdiv><div class=\"tbl-cell-m\" style=\"border-bottom:none;\">rgba(purple,.09)<\u002Fdiv><div class=\"tbl-cell-m\" style=\"border-bottom:none;\">Fill gold<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"sec-div\"><\u002Fdiv>\n\n    <!-- ─────────────────────────────────────\n         07  MOTION LANGUAGE\n    ───────────────────────────────────── -->\n    <section id=\"sg-motion\" style=\"max-width:900px;margin:0 auto;padding:80px 48px;\">\n      <div class=\"sg-tag-el\">07 · Motion<\u002Fdiv>\n      <h2 style=\"font-family:'Anton',sans-serif;font-size:clamp(36px,5vw,64px);text-transform:uppercase;color:#fff;line-height:.94;margin-bottom:14px;\">Motion <span style=\"color:#00D9F5;\">Language<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:15px;color:#7A8BAA;max-width:560px;line-height:1.78;margin-bottom:44px;\">Every animation serves a purpose: guiding attention, signalling liveness, or confirming interaction. We prioritise restraint — motion is subtle, never showy. All easing is standard <code style=\"font-family:'Courier Prime',monospace;color:#EDD483;\">ease<\u002Fcode>.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\">\n            <div style=\"width:8px;height:8px;background:#00D9F5;border-radius:50%;box-shadow:0 0 8px #00D9F5;animation:pulse 2.2s ease-in-out infinite;\"><\u002Fdiv>\n            <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;\">Pulse Dot<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">Used exclusively in the logo nav lockup to signal \"live.\" Breathes between 100% and 30% opacity. Never used as a general decorative element.<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">0%,100% → opacity:1, scale(1)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">50%  → opacity:0.3, scale(0.8)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">duration: 2.2s ease-in-out infinite<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;margin-bottom:14px;\">Scroll Fade-In<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">All sections and cards fade and slide up on scroll into view. Sibling elements stagger at 70ms increments. Triggered by IntersectionObserver (threshold 0.06).<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">.fi → translateY(22px) → 0<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">.fi-l → translateX(-20px) → 0<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">.fi-r → translateX(20px) → 0<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">transition: 0.6s ease, stagger 70ms<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;margin-bottom:14px;\">Hero Grid Movement<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">Hero section background grid drifts diagonally at 3.5% opacity — communicates perpetual computation without competing with foreground content.<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">from: bg-position 0 0<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">to: bg-position 64px 64px<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">20s linear infinite · opacity: 0.035<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">grid size: 64×64px · colour: --cyan<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;margin-bottom:14px;\">Card Hover Lift<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">All interactive cards lift on hover. Standard cards lift 3px; featured work/portfolio cards lift 5px. Border simultaneously lightens to --border.<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">standard: translateY(-3px)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">featured: translateY(-5px)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">border-color → --border · 0.25s ease<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;margin-bottom:14px;\">Nav Link Underline<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">Cyan underline expands left-to-right using <code style=\"font-family:'Courier Prime',monospace;font-size:11px;color:#EDD483;\">scaleX<\u002Fcode> on a ::after pseudo-element. Text colour transitions simultaneously to white.<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">scaleX(0) → scaleX(1)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">transform-origin: left<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">transition: 0.25s ease<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;color:#fff;margin-bottom:14px;\">CTA Button Glow<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;margin-bottom:12px;\">Primary action buttons emit a soft glow on hover derived from the tier colour. Opacity also dips to 90% for a subtle press effect.<\u002Fp>\n          <div style=\"background:#060810;border-radius:4px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">box-shadow: 0 0 30px var(--glow-c)<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#7A8BAA;\">opacity: 0.9<\u002Fspan>\n            <span style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">transition: 0.25s ease<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"sec-div\"><\u002Fdiv>\n\n    <!-- ─────────────────────────────────────\n         08  VOICE & TONE\n    ───────────────────────────────────── -->\n    <section id=\"sg-voice\" style=\"max-width:900px;margin:0 auto;padding:80px 48px;\">\n      <div class=\"sg-tag-el\">08 · Voice<\u002Fdiv>\n      <h2 style=\"font-family:'Anton',sans-serif;font-size:clamp(36px,5vw,64px);text-transform:uppercase;color:#fff;line-height:.94;margin-bottom:14px;\">Voice <span style=\"color:#FF5E20;\">&amp;<\u002Fspan> <span style=\"color:#00D9F5;\">Tone<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:15px;color:#7A8BAA;max-width:560px;line-height:1.78;margin-bottom:44px;\">AIMA speaks like the most dangerous creative in the room: technically precise, creatively bold, completely confident. Never corporate. Never timid. Never vague.<\u002Fp>\n\n      <!-- Three pillars -->\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:40px;\">\n        <div style=\"background:#0B0E1C;border-top:2px solid #00D9F5;border:1px solid rgba(255,255,255,.05);border-top-color:#00D9F5;border-radius:6px;padding:18px;\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:17px;text-transform:uppercase;color:#fff;margin-bottom:8px;\">Bold<\u002Fdiv>\n          <p style=\"font-size:13px;color:#7A8BAA;line-height:1.72;\">Statements, not suggestions. Declarative sentences. Active voice. Zero hedging. \"We deliver.\" \"You own it.\" \"No surprises.\"<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-top:2px solid #FF5E20;border-radius:6px;padding:18px;\">\n          <div st ions<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:12px;color:#7A8BAA;line-height:1.65;margin-top:12px;\">Grid: 1.6fr 1fr 1fr 1fr · collapses to 2-col at 780px, 1-col at 480px. Brand column: logo + .fb-sub (Courier .13em --cyan) + tagline + back-to-top button. Footer bottom: border-top --border, bg #060810.<\u002Fp>\n    <\u002Fsection>\n\n    <div class=\"sec-div\"><\u002Fdiv>\n\n    <!-- ─────────────────────────────────────\n         13  SPACING & GRID\n    ───────────────────────────────────── -->\n    <section id=\"sg-spacing\" style=\"max-width:900px;margin:0 auto;padding:80px 48px;\">\n      <div class=\"sg-tag-el\">13 · Spacing &amp; Grid<\u002Fdiv>\n      <h2 style=\"font-family:'Anton',sans-serif;font-size:clamp(36px,5vw,64px);text-transform:uppercase;color:#fff;line-height:.94;margin-bottom:14px;\">Spacing <span style=\"color:#EDD483;\">&amp;<\u002Fspan> Grid<\u002Fh2>\n      <p style=\"font-size:15px;color:#7A8BAA;max-width:560px;line-height:1.78;margin-bottom:44px;\">All spacing values are literal pixel tokens. The system avoids arbitrary values — every number maps to this table. When in doubt, pick the next step up on the scale.<\u002Fp>\n\n      <!-- ══ A: CSS CUSTOM PROPERTIES ══ -->\n      <div style=\"font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7A8BAA;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05);\">A · CSS Custom Properties (:root)<\u002Fdiv>\n      <div style=\"background:#0B0E1C;border:1px solid rgba(255,255,255,.05);border-radius:8px;overflow:hidden;margin-bottom:32px;\">\n        <div style=\"background:#060810;padding:18px 22px;font-family:'Courier Prime',monospace;font-size:12px;color:#7A8BAA;line-height:1.9;border-bottom:1px solid rgba(255,255,255,.05);\">\n          <div><span style=\"color:#A259FF;\">:root<\u002Fspan> <span style=\"color:#7A8BAA;\">{<\u002Fspan><\u002Fdiv>\n          <div style=\"padding-left:20px;\ ourier Prime',monospace;font-size:10px;color:#00D9F5;\">768px<\u002Fdiv><div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;\">Article header 50vh / 400px · body pad 40px 20px · article-nav → prev+next stack below all · footer 2-col<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:90px 1fr;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);\"><div style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">700px<\u002Fdiv><div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;\">Stat grid → 2-col<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:90px 1fr;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);\"><div style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">640px<\u002Fdiv><div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;\">Nav CTA hidden · hamburger burger appears<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:90px 1fr;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);\"><div style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">500px<\u002Fdiv><div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;\">Kiosk mosaic → 1-col<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:90px 1fr;padding:9px 14px;\"><div style=\"font-family:'Courier Prime',monospace;font-size:10px;color:#00D9F5;\">480px<\u002Fdiv><div style=\"font-size:12px;color:#7A8BAA;line-height:1.6;\">Stat grid → 1-col · footer → 1-col<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── PAGE FOOTER ── -->\n    <footer style=\"border-top:1px solid rgba(0,217,245,.08);padding:28px 48px;background:#030508;\">\n      <div style=\"max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;\">\n        <div style=\"display:flex;align-items:center;gap:9px;\">\n          <div style=\"width:6px;height:6px;background:#00D9F5;border-radius:50%;animation:pulse 2.2s ease-in-out infinite;\"><\u002Fdiv>\n          <span style=\"font-family:'Anton',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.05em;\"><span style=\"color:#fff;\">AI<\u002Fspan><span style=\"color:#00D9F5;\">MA<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'Courier Prime',monospace;font-size:9px;color:#7A8BAA;letter-spacing:.1em;text-transform:uppercase;\">Brand Style Guide · v1.0 · 2026 · Confidential<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace;font-size:9px;color:#7A8BAA;\">© 2026 AIMA · A Monkey Matters LLC Production<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 900}\n}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const sections = document.querySelectorAll('[id^=\"sg-\"]');\n    const navLinks = document.querySelectorAll('.sg-nav-link');\n\n    const updateActive = (id) => {\n      navLinks.forEach(link => {\n        const isActive = link.dataset.nav === id;\n        link.classList.toggle('active', isActive);\n      });\n    };\n\n    const observer = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          updateActive(entry.target.id);\n        }\n      });\n    }, { threshold: 0.15, rootMargin: '-10% 0px -75% 0px' });\n\n    sections.forEach(s => observer.observe(s));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
